# Publishes the app to GitHub Pages on every push to main.
# No build step: the repository root is served as-is.
name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      # Cache-bust the zero-build module graph: GitHub Pages serves files with
      # max-age=600, so without this a reload can mix a fresh index.html with
      # stale modules. Stamp every module URL with the commit and show the
      # build id in the settings menu. Repo files are untouched.
      - name: Stamp module URLs with the commit
        run: |
          set -e
          V="${GITHUB_SHA::7}"
          sed -i "s|src=\"src/main.js\"|src=\"src/main.js?v=$V\"|; s|__BUILD__|$V|" index.html
          sed -i -E "s|from \"(\./[a-z]+\.js)\"|from \"\1?v=$V\"|g" src/*.js
          grep -c "?v=$V" index.html src/main.js
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
