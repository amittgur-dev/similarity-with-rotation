# Publishes the app to GitHub Pages on every push to main.
# No build step: the repository root is served as-is.
name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      # Cache-bust the zero-build module graph: GitHub Pages serves files with
      # max-age=600, so without this a reload can mix a fresh index.html with
      # stale modules. Stamp every module URL with the commit and show the
      # build id in the settings menu. Repo files are untouched.
      - name: Stamp module URLs with the commit
        run: |
          set -e
          V="${GITHUB_SHA::7}"
          sed -i "s|src=\"src/main.js\"|src=\"src/main.js?v=$V\"|; s|href=\"styles.css\"|href=\"styles.css?v=$V\"|; s|__BUILD__|$V|" index.html
          # every static import form: from "./x.js" / import "./x.js" / import("./x.js"), single or double quotes
          sed -i -E "s#(from|import)([[:space:]]*\(?[[:space:]]*)([\"'])(\./[^\"'?]+\.js)\3#\1\2\3\4?v=$V\3#g" src/*.js
          printf '%s\n' "$V" > version.txt
          echo "index.html stamps: $(grep -c "?v=$V" index.html) · main.js stamps: $(grep -c "?v=$V" src/main.js)"
          test "$(grep -c "?v=$V" index.html)" = 2
          # fail the deploy on any local .js/.css reference that escaped the stamp
          ! grep -nE '(src|href)="[^"?:]+\.(js|css)"' index.html || { echo "unstamped reference in index.html"; exit 1; }
          ! grep -nE "[\"'](\./|src/)[^\"'?]+\.js[\"']" src/*.js || { echo "unstamped import in src/"; exit 1; }
          ! grep -nE 'new Worker\(|fetch\([\"'"'"']\./' src/*.js || { echo "unstamped runtime reference in src/"; exit 1; }
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
